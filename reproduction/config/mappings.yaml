# Corpus each CNNSpot group's REAL photographs were drawn from.
#
# `cnnspot_source_map` above names the GENERATOR of a group; CNNSpot files each real photograph
# under the generator group it is paired into, so `source == "progan"` on a real image means "the
# real half of the ProGAN evaluation subset" and NOT that ProGAN produced it. Annotating such an
# image "ProGAN" is wrong — use this map for label == 0 instead.
#
# Source: Wang et al., "CNN-Generated Images Are Surprisingly Easy to Spot… For Now" (CVPR 2020),
# appendix B.1 "Dataset Collection".
#
# Two sets of groups are deliberately ABSENT rather than guessed, and consumers must fall back to
# the subsplit directory in the image path:
#   - cyclegan: B.1 generates its real/fake pairs straight from the released CycleGAN code and names
#     no corpus. Its path carries a subsplit (apple, horse, orange, summer, winter, zebra).
#   - the diffusion-era groups (dalle, glide_*, guided, ldm_*, whichfaceisreal): these post-date B.1
#     and come from the later benchmark extension. Add them here once the provenance is confirmed.
cnnspot_real_source_map:
  progan: LSUN # 20 categories; reals centre-cropped on the long edge, resized to 256
  stylegan: LSUN # bedroom, cat, car
  stylegan2: LSUN # church, cat, horse, car
  biggan: ImageNet # reals centre-cropped on the long edge, resized to 256
  stargan: CelebA
  gaugan: COCO
  crn: GTA
  imle: GTA
  seeingdark: SITD # Sony/Fuji raw captures
  san: SR benchmarks # ground truth of Set5, Set14, BSD100, Urban100
  deepfake: FaceForensics++ # original sequences, cropped faces
  # Not from B.1: real-only pools whose group name IS the corpus (imagenet 38 real / 0 fake,
  # laion 41 real / 0 fake in the 4k eval frame), so naming them restates the group id.
  imagenet: ImageNet
  laion: LAION

